<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — BrightDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-page">

        <!-- Animated background blobs -->
        <div class="blobs" aria-hidden="true">
            <div class="blob blob--1"></div>
            <div class="blob blob--2"></div>
            <div class="blob blob--3"></div>
        </div>

        <!-- Login Card -->
        <div class="auth-card" role="main">

            <!-- Brand -->
            <div class="auth-brand">
                <span class="brand-icon">✨</span>
                <span class="brand-name">BrightDesk</span>
            </div>

            <!-- Header -->
            <div class="auth-header">
                <h1>Welcome back</h1>
                <p>Sign in to continue to your dashboard.</p>
            </div>

            <!-- Alert box — shown on success (after signup) or error -->
            <div class="alert" id="alert" role="alert" aria-live="polite" hidden></div>

            <!-- Login Form -->
            <form id="login-form" novalidate>

                <!-- Email -->
                <div class="field-group" id="group-email">
                    <label for="email" class="field-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="field-input"
                        placeholder="jane@example.com"
                        autocomplete="email"
                        required
                    >
                    <span class="field-error" id="error-email" aria-live="polite"></span>
                </div>

                <!-- Password with show/hide toggle -->
                <div class="field-group" id="group-password">
                    <label for="password" class="field-label">Password</label>
                    <div class="input-with-toggle">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="field-input"
                            placeholder="Your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" aria-label="Show password" data-target="password">
                            <!-- Crossed-out eye: shown when password is hidden -->
                            <svg class="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                            <!-- Regular eye: shown when password is visible -->
                            <svg class="icon-eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <span class="field-error" id="error-password" aria-live="polite"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner" hidden>
                        <svg class="spinner-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" opacity="0.75"/></svg>
                        Signing in…
                    </span>
                </button>

            </form>

            <!-- Link to Signup -->
            <p class="auth-switch">
                Don't have an account? <a href="/signup" class="link">Create one</a>
            </p>

        </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
