<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — BrightDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-page">

        <!-- Animated background blobs -->
        <div class="blobs" aria-hidden="true">
            <div class="blob blob--1"></div>
            <div class="blob blob--2"></div>
            <div class="blob blob--3"></div>
        </div>

        <!-- Sign Up Card -->
        <div class="auth-card" role="main">

            <!-- Brand -->
            <div class="auth-brand">
                <span class="brand-icon">✨</span>
                <span class="brand-name">BrightDesk</span>
            </div>

            <!-- Header -->
            <div class="auth-header">
                <h1>Create your account</h1>
                <p>Join BrightDesk — it only takes a minute.</p>
            </div>

            <!-- Alert box — shown on success or error -->
            <div class="alert" id="alert" role="alert" aria-live="polite" hidden></div>

            <!-- Sign Up Form -->
            <form id="signup-form" novalidate>

                <!-- Full Name -->
                <div class="field-group" id="group-fullName">
                    <label for="fullName" class="field-label">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        class="field-input"
                        placeholder="Jane Doe"
                        autocomplete="name"
                        required
                    >
                    <span class="field-error" id="error-fullName" aria-live="polite"></span>
                </div>

                <!-- Username -->
                <div class="field-group" id="group-username">
                    <label for="username" class="field-label">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="field-input"
                        placeholder="janedoe"
                        autocomplete="username"
                        required
                    >
                    <span class="field-error" id="error-username" aria-live="polite"></span>
                </div>

                <!-- Email -->
                <div class="field-group" id="group-email">
                    <label for="email" class="field-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="field-input"
                        placeholder="jane@example.com"
                        autocomplete="email"
                        required
                    >
                    <span class="field-error" id="error-email" aria-live="polite"></span>
                </div>

                <!-- Password -->
                <div class="field-group" id="group-password">
                    <label for="password" class="field-label">Password</label>
                    <div class="input-with-toggle">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="field-input"
                            placeholder="Min. 8 characters"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" aria-label="Show password" data-target="password">
                            <svg class="icon-eye-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-hide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                    <span class="field-hint">Must be 8+ characters, include an uppercase letter and a number.</span>
                    <span class="field-error" id="error-password" aria-live="polite"></span>
                </div>

                <!-- Confirm Password -->
                <div class="field-group" id="group-confirmPassword">
                    <label for="confirmPassword" class="field-label">Confirm Password</label>
                    <div class="input-with-toggle">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            class="field-input"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" aria-label="Show password" data-target="confirmPassword">
                            <svg class="icon-eye-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-hide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                    <span class="field-error" id="error-confirmPassword" aria-live="polite"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="signup-btn">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-spinner" hidden>
                        <svg class="spinner-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" opacity="0.75"/></svg>
                        Creating account…
                    </span>
                </button>

            </form>

            <!-- Link to Login -->
            <p class="auth-switch">
                Already have an account? <a href="/login" class="link">Sign in</a>
            </p>

        </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/signup.js"></script>
</body>
</html>
