<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — BrightDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <!--
        SECURITY NOTE:
        This page is served by the Express backend only after verifying
        the user's session cookie. If you try to open this URL without
        being logged in, the server redirects you to /login.
        There is no user data embedded in this HTML — everything is
        loaded by dashboard.js calling the /api/auth/me endpoint.
    -->

    <div class="dashboard-layout">

        <!-- ── Sidebar (desktop) ───────────────────────────────────── -->
        <aside class="sidebar" id="sidebar">

            <!-- Brand -->
            <div class="sidebar-brand">
                <span class="brand-icon">✨</span>
                <span class="brand-name">BrightDesk</span>
            </div>

            <!-- Navigation -->
            <nav class="sidebar-nav" role="navigation" aria-label="Main navigation">
                <button class="nav-btn active" data-section="home" aria-current="page">
                    <!-- Home icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Home
                </button>
                <button class="nav-btn" data-section="profile">
                    <!-- Profile icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
                    Profile
                </button>
            </nav>

            <!-- Logout button (bottom of sidebar) -->
            <div class="sidebar-footer">
                <button class="logout-btn" id="logout-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Mobile overlay — tap to close sidebar -->
        <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

        <!-- ── Main Area ───────────────────────────────────────────── -->
        <div class="main-area">

            <!-- Mobile top bar -->
            <header class="mobile-topbar">
                <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                </button>
                <span class="brand-name">BrightDesk</span>
                <button class="mobile-logout-btn" id="mobile-logout-btn" aria-label="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                </button>
            </header>

            <!-- Page content -->
            <main class="main-content">

                <!-- Loading state — shown while fetching user data -->
                <div class="loading-state" id="loading-state" aria-label="Loading your data">
                    <svg class="spinner-icon large" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" opacity="0.75"/></svg>
                    <p>Loading your dashboard…</p>
                </div>

                <!-- ── HOME SECTION ──────────────────────────────── -->
                <section class="content-section" id="section-home" hidden>

                    <div class="page-header">
                        <div>
                            <!-- Welcome message — name filled in by dashboard.js -->
                            <h1 class="page-title">
                                Welcome back, <span id="welcome-name" class="highlight">there</span>! 👋
                            </h1>
                            <p class="page-subtitle">Here's a quick overview of your account.</p>
                        </div>
                    </div>

                    <!-- Info cards grid -->
                    <div class="cards-grid">
                        <div class="info-card">
                            <div class="info-card__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
                            </div>
                            <div class="info-card__body">
                                <span class="info-card__label">Username</span>
                                <span class="info-card__value" id="home-username">—</span>
                            </div>
                        </div>

                        <div class="info-card">
                            <div class="info-card__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            </div>
                            <div class="info-card__body">
                                <span class="info-card__label">Email Address</span>
                                <span class="info-card__value" id="home-email">—</span>
                            </div>
                        </div>

                        <div class="info-card">
                            <div class="info-card__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                            </div>
                            <div class="info-card__body">
                                <span class="info-card__label">Member Since</span>
                                <span class="info-card__value" id="home-joined">—</span>
                            </div>
                        </div>
                    </div>

                </section>

                <!-- ── PROFILE SECTION ───────────────────────────── -->
                <section class="content-section" id="section-profile" hidden>

                    <div class="page-header">
                        <div>
                            <h1 class="page-title">My Profile</h1>
                            <p class="page-subtitle">Your registered account information.</p>
                        </div>
                    </div>

                    <!-- Profile card -->
                    <div class="profile-card">

                        <!-- Avatar with initials -->
                        <div class="profile-avatar" id="profile-avatar" aria-hidden="true">
                            <span id="avatar-initials">?</span>
                        </div>

                        <!-- Full name displayed below avatar -->
                        <h2 class="profile-name" id="profile-fullname">—</h2>
                        <p class="profile-username" id="profile-username-display">@—</p>

                        <!-- Detail rows -->
                        <div class="profile-details">

                            <div class="detail-row">
                                <span class="detail-label">Full Name</span>
                                <span class="detail-value" id="profile-fullname-detail">—</span>
                            </div>

                            <div class="detail-row">
                                <span class="detail-label">Username</span>
                                <span class="detail-value" id="profile-username-detail">—</span>
                            </div>

                            <div class="detail-row">
                                <span class="detail-label">Email Address</span>
                                <span class="detail-value" id="profile-email-detail">—</span>
                            </div>

                            <div class="detail-row">
                                <span class="detail-label">Member Since</span>
                                <span class="detail-value" id="profile-joined-detail">—</span>
                            </div>

                        </div>
                    </div>

                </section>

            </main>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
